image: golang:1.24

stages:
  - test
  - release

test:
  stage: test
  script:
    - go mod download
    - go test -v ./...

release:
  stage: release
  image:
    name: goreleaser/goreleaser:v1.26.2
    entrypoint: ['']
  only:
    - tags
  variables:
    GIT_DEPTH: "0"
  before_script:
    - |
      if [ -z "$GITLAB_TOKEN" ]; then
        echo "ERROR: GITLAB_TOKEN is not set!"
        echo "Please configure GITLAB_TOKEN variable in GitLab CI/CD settings:"
        echo "Settings -> CI/CD -> Variables -> Add variable"
        echo "Key: GITLAB_TOKEN"
        echo "Value: Your GitLab Personal Access Token with 'api' scope"
        exit 1
      fi
    - rm -rf /usr/local/go
    - wget https://go.dev/dl/go1.24.11.linux-amd64.tar.gz
    - tar -C /usr/local -xzf go1.24.11.linux-amd64.tar.gz
    - rm go1.24.11.linux-amd64.tar.gz
    - export PATH="/usr/local/go/bin:$PATH"
    - go version
    - go env GOROOT
    - go env GOPATH
    - |
      if [ -n "$GPG_PRIVATE_KEY" ]; then
        echo "$GPG_PRIVATE_KEY" | gpg --import --batch --no-tty || echo "GPG import failed, continuing without GPG signing"
      else
        echo "GPG_PRIVATE_KEY not set, skipping GPG import"
      fi
  script:
    - git remote set-url origin "$CI_REPOSITORY_URL" || git remote add origin "$CI_REPOSITORY_URL"
    - git fetch --depth=1 origin "$CI_COMMIT_SHA"
    - git fetch --tags origin
    - git checkout "$CI_COMMIT_SHA"
    - echo "Project ID is $CI_PROJECT_ID"
    # Build artifacts without publishing
    - goreleaser release --clean --skip=publish
    # Publish release using GitLab API directly
    - |
      echo "Creating release $CI_COMMIT_TAG..."
      curl --fail --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
           --header "Content-Type: application/json" \
           --request POST \
           --data "{\"tag_name\": \"$CI_COMMIT_TAG\", \"name\": \"Release $CI_COMMIT_TAG\", \"description\": \"Terraform Provider for Hostinger $CI_COMMIT_TAG\"}" \
           "https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/releases" || echo "Release already exists, continuing..."
    # Upload artifacts
    - |
      for file in dist/*.zip dist/*SHA256SUMS; do
        if [ -f "$file" ]; then
          filename=$(basename "$file")
          echo "Uploading $filename..."
          # Upload to package registry
          curl --fail --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
               --upload-file "$file" \
               "https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/packages/generic/terraform-provider-hostinger/$CI_COMMIT_TAG/$filename"
          # Add link to release
          curl --fail --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
               --header "Content-Type: application/json" \
               --request POST \
               --data "{\"name\": \"$filename\", \"url\": \"https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/packages/generic/terraform-provider-hostinger/$CI_COMMIT_TAG/$filename\", \"link_type\": \"package\"}" \
               "https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/releases/$CI_COMMIT_TAG/assets/links" || true
        fi
      done
    - echo "Release published successfully!"
