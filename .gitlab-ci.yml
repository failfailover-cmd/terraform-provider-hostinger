image: golang:1.24

stages:
  - test
  - release

test:
  stage: test
  script:
    - go test -v ./...

release:
  stage: release
  image:
    name: goreleaser/goreleaser:latest
    entrypoint: ['']
  only:
    - tags
  variables:
    # Используем GITLAB_TOKEN из CI/CD переменных для публикации релизов
    GITLAB_TOKEN: $GITLAB_TOKEN
  # Временно отключено до настройки GPG ключа
  # before_script:
  #   - echo "$GPG_PRIVATE_KEY" | gpg --import --batch --no-tty
  script:
    - goreleaser release --clean
