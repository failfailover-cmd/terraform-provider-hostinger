version: 2

project_name: terraform-provider-hostinger

gitlab_urls:
  api: https://gitlab.com/api/v4/
  download: https://gitlab.com/

# ---------------------------
#          BUILDS
# ---------------------------
builds:
  - id: provider
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - "-s -w -X main.version={{.Version}}"
    binary: "{{ .ProjectName }}_v{{ .Version }}"

# ---------------------------
#         ARCHIVES
# ---------------------------
archives:
  - id: release-zip
    format: zip
    files:
      - LICENSE
      - README.md
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

# ---------------------------
#         CHECKSUMS
# ---------------------------
checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"

# ---------------------------
#         RELEASE (GitLab)
# ---------------------------
release:
  draft: false

# ---------------------------
#         CHANGELOG
# ---------------------------
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
