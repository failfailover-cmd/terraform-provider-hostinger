version: 2

project_name: terraform-provider-hostinger

# ---------------------------
#       BUILD SETTINGS
# ---------------------------
builds:
  - env:
      - CGO_ENABLED=0
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    ldflags:
      - '-s -w -X main.version={{.Version}}'
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    binary: '{{ .ProjectName }}_v{{ .Version }}'

# ---------------------------
#       ARCHIVES
# ---------------------------
archives:
  - format: zip
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - LICENSE
      - README.md

# ---------------------------
#       CHECKSUM
# ---------------------------
checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256

# ---------------------------
#       RELEASE (GitLab)
# ---------------------------
release:
  gitlab:
    # GitLab namespace (group/subgroup/subgroup)
    owner: "a4765/infra/devops/terraform_providers"
    # Repository name
    name: "hostinger"
    # Токен берётся из $GITLAB_TOKEN автоматически
  draft: false
  prerelease: auto

# ---------------------------
#       CHANGES
# ---------------------------
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
